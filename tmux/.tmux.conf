setw -g window-status-current-style 'fg=black bg=green'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

set -g escape-time 0

# mouse
set -g mouse on
# Index starts from one not zero
set -g base-index 1

# new window in currecnt directory
bind-key c new-window -c "#{pane_current_path}"

# splits remain in current directory
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

bind-key 'r' source-file ~/.tmux.conf

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Status bar
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-right "%H:%M  %d %b "
set -g status-left "#[fg=#fab387,bold] #S "
setw -g window-status-current-style "bg=#fab387,fg=#1e1e2e,bold"
set -g pane-active-border-style "fg=#fab387"

# panes
set -g pane-border-style 'fg=#45475a'
#set -g pane-active-border-style 'fg=green'

set-option -g renumber-windows on

# Copying from tmux select to clipboard https://unix.stackexchange.com/a/131187/293235
if-shell "[[ $(uname) == Darwin ]]" 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"'
